[project]
name = "kickstream"
version = "0.1.0"
description = "Kickstream pipeline: synthetic match events to live narratives"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.143.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
  "sse-starlette==3.5.0",
  "websockets>=17,<18",
  "agent-framework-core==1.21.0",
  "agent-framework-openai>=1.16,<2",
  "agent-framework-orchestrations>=1.3,<2",
  "azure-communication-rooms==1.2.0",
  "azure-communication-identity==1.5.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "httpx==0.28.1",
  "datamodel-code-generator==0.83.0",
  "ruff==0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kickstream"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["network: reaches real services on the internet; never part of the default run"]

[tool.ruff]
line-length = 110
extend-exclude = ["kickstream/contracts.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
# Line length is the formatter's job; long template strings are left as they are.
ignore = ["E501"]
